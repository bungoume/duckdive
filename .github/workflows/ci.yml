name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

# One run per branch; a newer push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a commit SHA; the comment carries the release it points at and
# Renovate (helpers:pinGitHubActionDigests) bumps both together.

# Every job stands alone and they all run at once, so a push is answered in about two minutes
# rather than the sum of the suites. The e2e jobs pay for their own checkout and browser (about
# half a minute each) to keep it that way.

jobs:
  check:
    name: typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the pnpm release pinned in package.json#packageManager plus Node, restores the
      # store cache and runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test:unit

  smoke-e2e:
    name: smoke e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      - run: pnpm run build:e2e
      # --with-deps only adds font packages on the runner image, no libraries, and the suites
      # pin the UI to English and keep screenshots for failures only. Add it back before
      # asserting on CJK text in the browser.
      - run: pnpm exec playwright install chromium
      - run: node e2e/smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: smoke-screenshots
          path: '*.png'

  cache-e2e:
    name: cache e2e (needs the duckdb CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      - run: pnpm run build:e2e
      - run: pnpm exec playwright install chromium
      # A pinned release asset verified against its sha256, instead of `curl | sh` of the
      # unversioned installer. Renovate refreshes the tag and the digest together
      # (customManagers in renovate.json). This CLI writes the fixtures that duckdb-wasm reads
      # back; the `duckdb-versions` section of e2e/cache.mjs compares the two.
      - name: Install the duckdb CLI
        env:
          # renovate: datasource=github-release-attachments depName=duckdb/duckdb
          DUCKDB_VERSION: 'v1.5.5'
          DUCKDB_CLI_SHA256: '08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05'
        run: |
          curl -fsSL --retry 3 -o duckdb_cli-linux-amd64.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          echo "${DUCKDB_CLI_SHA256}  duckdb_cli-linux-amd64.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          unzip -q -o duckdb_cli-linux-amd64.zip -d "$HOME/.local/bin"
          rm duckdb_cli-linux-amd64.zip
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: duckdb --version
      - run: node e2e/cache.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: cache-screenshots
          path: '*.png'

  pack:
    name: store build and zip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      # The checks scripts/pack.mjs makes (store host permissions only, no `__ddv` hooks, every
      # locale's description within the store's limit) are what the release depends on, so they run
      # on every push rather than for the first time at the tag.
      - run: pnpm run pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-zip
          path: release/*.zip
