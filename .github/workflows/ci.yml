name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every action is pinned to a commit SHA; the comment carries the release it points at and
# Renovate (helpers:pinGitHubActionDigests) bumps both together.

jobs:
  check:
    name: typecheck, lint, unit tests, smoke e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the pnpm release pinned in package.json#packageManager plus Node, restores the
      # store cache and runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test:unit
      - run: pnpm run build:e2e
      - run: pnpm exec playwright install --with-deps chromium
      - run: node e2e/smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: smoke-screenshots
          path: '*.png'

  cache-e2e:
    name: cache e2e (needs the duckdb CLI)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true
      - run: pnpm run build:e2e
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install the duckdb CLI
        run: |
          curl -fsSL https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/latest" >> "$GITHUB_PATH"
      - run: duckdb --version
      - run: node e2e/cache.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: cache-screenshots
          path: '*.png'
