name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

# One run per branch; a newer push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a commit SHA; the comment carries the release it points at and
# Renovate (helpers:pinGitHubActionDigests) bumps both together.

# Every job stands alone and they all run at once, so a push is answered in about two minutes
# rather than the sum of the suites. The e2e jobs pay for their own checkout and browser (about
# half a minute each) to keep it that way.

jobs:
  check:
    name: typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the pnpm release pinned in package.json#packageManager plus Node, restores the
      # store cache and runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test:unit

  smoke-e2e:
    name: smoke e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      - run: pnpm run build:e2e
      # --with-deps only adds font packages on the runner image, no libraries, and the suites
      # pin the UI to English and keep screenshots for failures only. Add it back before
      # asserting on CJK text in the browser.
      - run: pnpm exec playwright install chromium
      - run: node e2e/smoke.mjs
      - run: node e2e/log-diff.mjs
      - run: node e2e/alb-analysis.mjs
      - run: node e2e/cloudfront-analysis.mjs
      - run: node e2e/vpc-flow-analysis.mjs
      - run: node e2e/cloudtrail-analysis.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: smoke-screenshots
          path: release/e2e/*.png

  cache-e2e:
    name: cache e2e (needs the duckdb CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      - run: pnpm run build:e2e
      - run: pnpm exec playwright install chromium
      # A pinned release asset verified against its sha256, instead of `curl | sh` of the
      # unversioned installer. Renovate refreshes the tag and the digest together
      # (customManagers in .github/renovate.json). This CLI writes the fixtures that duckdb-wasm reads
      # back; the `duckdb-versions` section of e2e/cache.mjs checks Parquet interoperability.
      - name: Install the duckdb CLI
        env:
          # renovate: datasource=github-release-attachments depName=duckdb/duckdb
          DUCKDB_VERSION: 'v2.0.0'
          DUCKDB_CLI_SHA256: 'c6507206baf7793c6013dbd82368469a45f20dc0e17a6f92f204602f652ed2bc'
        run: |
          curl -fsSL --retry 3 -o duckdb-cli-linux-amd64.tar.gz \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb-cli-linux-amd64.tar.gz"
          echo "${DUCKDB_CLI_SHA256}  duckdb-cli-linux-amd64.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf duckdb-cli-linux-amd64.tar.gz -C "$HOME/.local/bin" duckdb
          rm duckdb-cli-linux-amd64.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: duckdb --version
      - run: node e2e/cache.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: cache-screenshots
          path: release/e2e/*.png

  pack:
    name: browser builds and store zips
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      # The checks scripts/pack.mjs makes for all browser packages are what the release depends on,
      # so they run on every push rather than for the first time at the tag.
      - run: pnpm run pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-zips
          path: release/*.zip
