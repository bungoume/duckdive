name: Release

# Every push to main updates the release pull request: release-please keeps the version in
# package.json, the new CHANGELOG.md section and the release notes inside it, built from the
# Conventional Commit subjects since the last tag. Merging that pull request tags the version
# and creates the GitHub Release; the second job attaches the store zip to it. Tags are never
# moved or rewritten; a broken release is fixed by the next version.

on:
  push:
    branches: [main]

# Nothing is granted by default; the jobs below ask for what they need.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: maintain the release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the tag and the release
      pull-requests: write # open and update the release pull request
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  publish:
    name: build the store zip and attach it to the release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # upload the zip to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # No dependency cache here: this job produces the file that goes to the Web Store, and a
      # poisoned cache entry would end up inside it.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@26
          cache: false
          require-lockfile: true

      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test:unit
      # Builds a store build and refuses to zip anything else (scripts/pack.mjs).
      - run: pnpm run pack

      - name: Attach the store zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        # release-please has already created the release with its notes; this only adds the file.
        run: gh release upload "$TAG" release/*.zip --clobber
